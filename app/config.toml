# إعداد الثيم الداكن لتطبيق تدقيق ETABS.
# ضع هذا الملف داخل مجلد اسمه ".streamlit" في نفس مسار etabs_audit_app.py
# بالضبط (المسار النهائي: .streamlit/config.toml بجانب السكربت)، لأن هذا هو
# المسار الوحيد الذي يقرأ منه Streamlit إعدادات الثيم.
#
# هذا الملف ضروري تحديداً لتلوين جداول st.dataframe (شبكة بيانات تفاعلية
# مستقلة لا تتأثر بتنسيقات CSS العادية المكتوبة داخل الكود)؛ تنسيقات العناوين
# والشريط الجانبي في الكود نفسه تعمل بدونه، لكن الجداول تحتاجه حصراً.

[theme]
base = "dark"
primaryColor = "#f2d675"
backgroundColor = "#4c6081"
secondaryBackgroundColor = "#1b2330"
textColor = "#e8ecf1"
font = "sans serif"
